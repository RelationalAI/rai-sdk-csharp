name: Nuget Package

on:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install dependencies
      run: dotnet restore

    - name: Pack
      run: dotnet pack --configuration Release --no-restore --include-symbols

    - name: Publish Nuget Package to Nuget.org
      run: |
        # Filepath of the project to be packaged, relative to root of repository
        # PROJECT_FILE_PATH: RelationalAI/RelationalAI.csproj

        # NuGet package id, used for version detection & defaults to project name
        # PACKAGE_NAME: RelationalAI

        # Filepath with version info, relative to root of repository & defaults to PROJECT_FILE_PATH
        # VERSION_FILE_PATH: RelationalAI/RelationalAI.csproj

        # Regex pattern to extract version info in a capturing group
        # VERSION_REGEX: ^\s*<Version>(.*)<\/Version>\s*$

        # Flag to toggle git tagging, enabled by default
        # TAG_COMMIT: false

        # Format of the git tag, [*] gets replaced with actual version
        # TAG_FORMAT: v*

        # API key to authenticate with NuGet server
        # NUGET_KEY: ${{secrets.NUGET_KEY}}

        # NuGet server uri hosting the packages, defaults to https://api.nuget.org/v3/index.json
        # NUGET_SOURCE: https://api.nuget.org/v3/index.json

        # Flag to toggle pushing symbols along with nuget package to the server, enabled by default
        # INCLUDE_SYMBOLS: true
        
        dotnet nuget push RelationalAI/bin/Release/*.nupkg --api-key ${{secrets.NUGET_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
        dotnet nuget push RelationalAI/bin/Release/*.snupkg --api-key ${{secrets.NUGET_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
